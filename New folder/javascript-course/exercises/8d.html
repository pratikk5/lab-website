  <body>
    <script>
    function comparePrice(product1, product2) {
      if (product1.price < product2.price) {
        return product1;
      } else {
        return product2;
      }
    }

    const product1={
      name: 'shoes',
      price: 100
    }
    
    const product2={
      name: 'shirts',
      price: 200
    }
    console.log(comparePrice(product1, product2));

    </script>
  </body>
</html>
